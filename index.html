<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samlar Avito Monitor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10141d;color:#eef2fa;font-family:Arial,sans-serif;padding:25px}
.container{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:25px}
h1{font-size:25px}
.muted{color:#929caf;font-size:13px}
.status{background:#123b2c;color:#54e6a0;padding:10px 15px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
.card{background:#1b2230;border:1px solid #2b3547;border-radius:14px;padding:22px}
.card p{color:#9daabd;font-size:14px}
.number{font-size:34px;font-weight:bold}
.blue{color:#70aaff}
.green{color:#55e5a0}
.orange{color:#ffbd65}
.section{margin-top:25px}
.log{background:#171e2a;padding:17px;border-radius:12px;font-family:monospace;font-size:13px;line-height:2;color:#aebbd0}
.log div{border-bottom:1px solid #293344}
button{background:#3478f6;color:white;border:0;padding:13px 18px;border-radius:9px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<header>
<div>
<h1>◈ SAMLAR AVITO MONITOR</h1>
<p class="muted">Система демонстрации мониторинга недвижимости</p>
</div>
<div class="status">● DEMO ONLINE</div>
</header>

<div class="grid">
<div class="card"><p>Проверено объявлений</p><div class="number blue" id="checked">248</div></div>
<div class="card"><p>Найдено новых</p><div class="number green" id="found">12</div></div>
<div class="card"><p>От собственников</p><div class="number orange" id="owners">8</div></div>
<div class="card"><p>Отфильтровано</p><div class="number" id="filtered">4</div></div>
</div>

<div class="section">
<h2>Журнал событий</h2>
<div class="log" id="logs">
<div>Система демонстрации запущена</div>
</div>
</div>

<div class="section">
<button onclick="simulate()">Запустить проверку вручную</button>
<p class="muted" id="time">Ожидание запуска...</p>
<p class="muted">Демонстрационный режим. Данные генерируются автоматически.</p>
</div>
</div>

<script>
let checked = 248;
let found = 12;
let owners = 8;
let filtered = 4;

const events = [
"Подключение к тестовому источнику",
"Проверка новых объявлений",
"Анализ предложений от собственников",
"Проверка дубликатов",
"Фильтрация результатов",
"Тестовый цикл успешно завершён"
];

function addLog(message) {
    const logs = document.getElementById("logs");
    const line = document.createElement("div");
    line.textContent = "● " + new Date().toLocaleTimeString("ru-RU") + " — " + message;
    logs.prepend(line);

    while (logs.children.length > 20) {
        logs.removeChild(logs.lastElementChild);
    }
}

function simulate() {
    checked += Math.floor(Math.random() * 20) + 5;

    const newFound = Math.floor(Math.random() * 3) + 1;
    found += newFound;
    owners += Math.floor(Math.random() * 2);
    filtered += Math.floor(Math.random() * 2);

    document.getElementById("checked").textContent = checked;
    document.getElementById("found").textContent = found;
    document.getElementById("owners").textContent = owners;
    document.getElementById("filtered").textContent = filtered;

    const event = events[Math.floor(Math.random() * events.length)];
    addLog(event);

    document.getElementById("time").textContent =
        "Последнее обновление: " + new Date().toLocaleTimeString("ru-RU");
}

// Первый запуск и автоматические проверки
addLog("Автоматический режим активирован");
document.getElementById("time").textContent =
    "Последнее обновление: " + new Date().toLocaleTimeString("ru-RU");

setInterval(simulate, 5000);
</script>
</body>
</html>
